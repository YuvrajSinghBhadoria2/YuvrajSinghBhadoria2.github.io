<header class="site-header" role="banner">
  <div class="wrapper">
    <a class="site-title" href="{{ "/" | relative_url }}">{{ site.title | default: site.name | escape }}</a>
    <nav class="site-nav">
      <input type="checkbox" id="nav-trigger" class="nav-trigger" />
      <label for="nav-trigger">
        <span class="menu-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18"><path d="M18,1.484c0-0.82-0.665-1.484-1.484-1.484H1.484C0.665,0,0,0.665,0,1.484v15.031C0,17.335,0.665,18,1.484,18h15.031C17.335,18,18,17.335,18,16.516V1.484z M15.503,15.503H2.497V2.497h13.006V15.503z"/></svg>
        </span>
      </label>
      <div class="trigger">
        {%- if page.url == "/start-here/" -%}
          <a class="page-link" href="{{ "/" | relative_url }}">&larr; Home</a>
        {%- else -%}
          <a class="page-link" href="{{ "/start-here/" | relative_url }}">&larr; All posts</a>
        {%- endif -%}
        <a class="page-link" href="{{ "/grammar-spec-decoding/" | relative_url }}">Latest post</a>
      </div>
    </nav>
  </div>
</header>
